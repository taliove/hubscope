# Release notes categorization for `gh release create --generate-notes`.
# Every merged PR carries exactly one category label (enforced by habit and
# the PR template); unlabeled PRs and direct commits land in Other Changes.
changelog:
  exclude:
    labels:
      - duplicate
      - invalid
      - question
      - wontfix
  categories:
    - title: Features
      labels:
        - enhancement
    - title: Fixes
      labels:
        - bug
    - title: Documentation
      labels:
        - documentation
    - title: Maintenance
      labels:
        - chore
        - ci
    - title: Other Changes
      labels:
        - "*"
