name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Build frontend (embedded into every binary)
        working-directory: web
        run: |
          pnpm install
          pnpm build

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      - name: Cross-compile release binaries
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            os="${target%/*}"
            arch="${target#*/}"
            out="dist/hubscope_${TAG}_${os}_${arch}"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath -ldflags="-s -w" -o "$out" ./cmd/hubscope
            tar -C dist -czf "${out}.tar.gz" "$(basename "$out")"
            rm "$out"
            echo "built ${out}.tar.gz"
          done
          (cd dist && shasum -a 256 *.tar.gz > "hubscope_${TAG}_checksums.txt")
          ls -la dist/

      - name: Smoke-test linux/amd64 binary
        run: |
          tar -xzf "dist/hubscope_${GITHUB_REF_NAME}_linux_amd64.tar.gz" -C /tmp
          test -x "/tmp/hubscope_${GITHUB_REF_NAME}_linux_amd64"
          echo "binary extracted and executable: OK"

      - name: Create GitHub Release with notes and assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          # create (not upload) so the workflow is self-contained — no
          # manual `gh release create` race before the upload step. Notes are
          # auto-generated from merged PRs and categorized per
          # .github/release.yml. Re-runs on an existing release only refresh
          # the assets.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.tar.gz "dist/hubscope_${TAG}_checksums.txt" --clobber
          else
            gh release create "$TAG" dist/*.tar.gz "dist/hubscope_${TAG}_checksums.txt" \
              --title "$TAG" --generate-notes --verify-tag
          fi
