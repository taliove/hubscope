name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Build frontend (embedded into every binary)
        working-directory: web
        run: |
          pnpm install
          pnpm build

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      - name: Cross-compile release binaries
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            os="${target%/*}"
            arch="${target#*/}"
            out="dist/hubscope_${TAG}_${os}_${arch}"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath -ldflags="-s -w" -o "$out" ./cmd/hubscope
            tar -C dist -czf "${out}.tar.gz" "$(basename "$out")"
            rm "$out"
            echo "built ${out}.tar.gz"
          done
          (cd dist && shasum -a 256 *.tar.gz > "hubscope_${TAG}_checksums.txt")
          ls -la dist/

      - name: Smoke-test linux/amd64 binary
        run: |
          tar -xzf "dist/hubscope_${GITHUB_REF_NAME}_linux_amd64.tar.gz" -C /tmp
          test -x "/tmp/hubscope_${GITHUB_REF_NAME}_linux_amd64"
          echo "binary extracted and executable: OK"

      - name: Create GitHub Release with notes and assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"

          # Assemble the notes: fixed install/upgrade section + the highlights
          # carried in the tag annotation + auto-generated categorized changes.
          # actions/checkout fetches the tag push by commit sha
          # (+<commit>:refs/tags/<tag>), which replaces the tag ref with a
          # LIGHTWEIGHT tag — the annotation object is not in the clone.
          # Re-fetch the tag ref explicitly to restore the annotation.
          git fetch --no-tags --depth=1 origin "+refs/tags/${TAG}:refs/tags/${TAG}"
          HIGHLIGHTS="$(git tag -l --format='%(contents:body)' "$TAG")"
          {
            echo "## Install / Upgrade"
            echo ""
            echo "**One-command install** (Linux, systemd service):"
            echo '```sh'
            echo "curl -fsSL https://raw.githubusercontent.com/taliove/hubscope/main/scripts/install.sh | sudo bash"
            echo '```'
            echo "**Docker**:"
            echo '```sh'
            echo "git clone https://github.com/taliove/hubscope.git && cd hubscope"
            echo "docker compose up -d --build"
            echo '```'
            echo "**Binaries**: download the tarball for your platform below (linux/darwin × amd64/arm64). Verify with \`${TAG}_checksums.txt\`:"
            echo '```sh'
            echo "sha256sum -c hubscope_${TAG}_checksums.txt --ignore-missing"
            echo '```'
            echo "Already running an older release? Re-run the same command you installed with — it upgrades in place and preserves data."
            echo ""
            if [ -n "$HIGHLIGHTS" ]; then
              echo "## Highlights"
              echo ""
              echo "$HIGHLIGHTS"
              echo ""
            fi
          } > fixed-notes.md

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.tar.gz "dist/hubscope_${TAG}_checksums.txt" --clobber
          else
            gh release create "$TAG" dist/*.tar.gz "dist/hubscope_${TAG}_checksums.txt" \
              --title "$TAG" --generate-notes --verify-tag \
              --notes-file fixed-notes.md
          fi

          # --generate-notes appends its output after our notes-file; strip
          # the sections that are noise for this repo (solo maintainer:
          # "New Contributors" is always the same person). The section is
          # always last in the generated output, so cut from its heading to
          # the next heading (or EOF), then re-append Full Changelog if the
          # cut swallowed it.
          CURRENT_BODY="$(gh release view "$TAG" --json body --jq .body)"
          printf '%s\n' "$CURRENT_BODY" | awk '
            /^## New Contributors$/          { skip=1; next }
            skip && /^\*\*Full Changelog\*\*/ { skip=0 }
            skip && /^## /                   { skip=0 }
            skip && /^[*]/                   { next }
            !skip                            { print }
          ' > clean-notes.md
          gh release edit "$TAG" --notes-file clean-notes.md
