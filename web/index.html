<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>HubScope</title>
    <script>
      // Anti-FOUC theme bootstrap: apply the persisted theme before first
      // paint. Reads the SAME localStorage key as web/src/utils/theme.ts —
      // keep the key name in sync between the two files.
      ;(function () {
        try {
          if (localStorage.getItem('hs:dark') === '1') {
            document.documentElement.classList.add('dark')
          }
        } catch (e) {
          /* localStorage unavailable (private mode etc.) — stay light */
        }
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
